# ──────────────────────────────────────────────────────────────────────────────
# GitHub Actions Workflow: C++ Compilation
#
# Builds the Bioacoustic VAMP Plugin Pack (BirdNET + Perch + SurfPerch + YAMNet + PiedTamarin) as shared
# libraries: .so on Ubuntu 24.04, .dll on Windows (via MSYS2/MinGW), .dylib on macOS (via Homebrew),
# and optionally publishes them as a GitHub Release when a version tag is pushed. 
#
# Prof. Juan G. Colonna, IComp, UFAM.
#
# ──────────────────────────────────────────────────────────────────────────────
name: C++ Compilation

# ── Trigger conditions ────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]       # Run on every push to the main branch
    tags:
      - 'v*'                 # Also run when a version tag is pushed (e.g. v1.0.0)
  pull_request:
    branches: [ main ]       # Run on pull requests targeting main
  workflow_dispatch:         # Allow manual triggering from the Actions tab

# ── Permissions ───────────────────────────────────────────────────────────────
# 'contents: write' is required to create GitHub Releases and upload assets.
permissions:
  contents: write

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  build:
    strategy:
      fail-fast: false                                     # deixa cada job terminar independente dos outros
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]   

    runs-on: ${{ matrix.os }}

    steps:
      # ── Step 1: Check out the repository ────────────────────────────────────
      # Fetches the full repository source so subsequent steps can access all
      # files, including subfolders like birdnet_plugin/, perch_plugin/, and
      # surfperch_plugin/.
      - name: Checkout
        uses: actions/checkout@v6

      # ── Step 2: Install build dependencies ──────────────────────────────────
      # Linux: installs cmake, g++ (C++17 compiler), and vamp-plugin-sdk via apt.
      # Windows: installs the equivalent MinGW toolchain, cmake, ninja, and
      # vamp-plugin-sdk via MSYS2/pacman (mingw-w64-ucrt-x86_64-* packages).   
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'               
        run: |
          sudo apt update
          sudo apt install -y cmake g++ vamp-plugin-sdk

      # Installs the GCC (MinGW) toolchain + CMake + vamp-plugin-sdk via MSYS2/pacman.
      # Keeps the same compiler (GCC) used on Linux, avoiding the need to port the project to MSVC.
      - name: Install Dependencies (Windows via MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk

      # Homebrew comes pre-installed on GitHub's macOS runners.
      # The compiler (Apple Clang) is included with the runner's Xcode Command Line Tools;
      # only cmake and the VAMP SDK are missing.
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake vamp-plugin-sdk

      # ── Step 3: Verify static VAMP SDK library ──────────────────────────────
      # The CMakeLists.txt links against libvamp-sdk.a to avoid requiring
      # libvamp-sdk.so on the user's system.
      - name: Check static VAMP SDK (Linux)
        if: runner.os == 'Linux'               
        run: |
          find /usr/lib /usr/lib64 -name "libvamp-sdk.a" -print

      # Equivalent in MSYS2 UCRT64 environment
      - name: Check static VAMP SDK (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          find /ucrt64/lib -name "libvamp-sdk.a" -print

      # Search on both possible Homebrew prefixes, but only one exists at a time,
      # depending on the runner architecture (Apple Silicon vs. Intel); || true prevents
      # a "no such directory" error for the missing path from causing the step to fail.
      - name: Check static VAMP SDK (macOS)
        if: runner.os == 'macOS'
        run: |
          find /opt/homebrew/lib /usr/local/lib -name "libvamp-sdk.a" -print 2>/dev/null || true

      # ── Step 4: Compile VAMP plugins ────────────────────────────────────────
      # Runs CMake in Release mode.
      # The CMakeLists.txt at the repo root defines five targets, producing
      # birdnet-vamp / perch-vamp / surfperch-vamp / yamnet-vamp / piedtamarin-vamp
      # as build/<target>.so on Linux (make -j$(nproc)), build/<target>.dll on
      # Windows (Ninja, via cmake --build --parallel), and build/<target>.dylib
      # on macOS (Unix Makefiles default, via cmake --build --parallel).        
      - name: Compile on Linux
        if: runner.os == 'Linux'                
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      # Same workflow (mkdir build && cmake && build), but with the Ninja generator,
      # which is single-config and avoids the extra build/Release/ folder created by Visual Studio generators.
      - name: Compile on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel

      # macOS doesn't have "nproc" (that's part of GNU coreutils, not BSD/macOS),
      # so use "cmake --build . --parallel" instead of "make -j$(nproc)"; CMake automatically
      # detects the available cores, just like on Windows.
      - name: Compile on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel

      # ── Step 5: Collect all distributable files into a staging folder ───────
      # Gathers the compiled shared libraries (.so on Linux, .dll on Windows,      
      # .dylib on macOS), Python inference scripts, and label files into 'dist'.
      - name: Prepare Release Files (Linux)
        if: runner.os == 'Linux'                
        run: |
          mkdir dist
          mv build/birdnet-vamp.so dist/birdnet-vamp.so
          cp birdnet_plugin/birdnet_run.py dist/birdnet_run.py
          cp birdnet_plugin/birdnet_labels.csv dist/birdnet_labels.csv

          mv build/perch-vamp.so dist/perch-vamp.so
          cp perch_plugin/perch_run.py dist/perch_run.py
          cp perch_plugin/perch_labels.csv dist/perch_labels.csv

          mv build/surfperch-vamp.so dist/surfperch-vamp.so
          cp surfperch_plugin/surfperch_run.py dist/surfperch_run.py
          cp surfperch_plugin/reef_labels.csv dist/reef_labels.csv

          mv build/yamnet-vamp.so dist/yamnet-vamp.so
          cp yamnet_plugin/yamnet_run.py dist/yamnet_run.py
          cp yamnet_plugin/yamnet_labels.csv dist/yamnet_labels.csv

          mv build/piedtamarin-vamp.so dist/piedtamarin-vamp.so
          cp piedtamarin_plugin/piedtamarin_run.py dist/piedtamarin_run.py

      # Identical to the block above, but with the .dll extension (native CMake output on Windows).
      # Assumes that CMakeLists.txt does not manually force the ".so" extension on the SHARED lib.
      - name: Prepare Release Files (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir dist
          mv build/birdnet-vamp.dll dist/birdnet-vamp.dll
          cp birdnet_plugin/birdnet_run.py dist/birdnet_run.py
          cp birdnet_plugin/birdnet_labels.csv dist/birdnet_labels.csv

          mv build/perch-vamp.dll dist/perch-vamp.dll
          cp perch_plugin/perch_run.py dist/perch_run.py
          cp perch_plugin/perch_labels.csv dist/perch_labels.csv

          mv build/surfperch-vamp.dll dist/surfperch-vamp.dll
          cp surfperch_plugin/surfperch_run.py dist/surfperch_run.py
          cp surfperch_plugin/reef_labels.csv dist/reef_labels.csv

          mv build/yamnet-vamp.dll dist/yamnet-vamp.dll
          cp yamnet_plugin/yamnet_run.py dist/yamnet_run.py
          cp yamnet_plugin/yamnet_labels.csv dist/yamnet_labels.csv

          mv build/piedtamarin-vamp.dll dist/piedtamarin-vamp.dll
          cp piedtamarin_plugin/piedtamarin_run.py dist/piedtamarin_run.py

      # Identical to the blocks above, but with the .dylib extension (native
      # CMake output for SHARED libs on macOS, without needing to force a SUFFIX in CMakeLists.txt).
      - name: Prepare Release Files (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          mv build/birdnet-vamp.dylib dist/birdnet-vamp.dylib
          cp birdnet_plugin/birdnet_run.py dist/birdnet_run.py
          cp birdnet_plugin/birdnet_labels.csv dist/birdnet_labels.csv

          mv build/perch-vamp.dylib dist/perch-vamp.dylib
          cp perch_plugin/perch_run.py dist/perch_run.py
          cp perch_plugin/perch_labels.csv dist/perch_labels.csv

          mv build/surfperch-vamp.dylib dist/surfperch-vamp.dylib
          cp surfperch_plugin/surfperch_run.py dist/surfperch_run.py
          cp surfperch_plugin/reef_labels.csv dist/reef_labels.csv

          mv build/yamnet-vamp.dylib dist/yamnet-vamp.dylib
          cp yamnet_plugin/yamnet_run.py dist/yamnet_run.py
          cp yamnet_plugin/yamnet_labels.csv dist/yamnet_labels.csv

          mv build/piedtamarin-vamp.dylib dist/piedtamarin-vamp.dylib
          cp piedtamarin_plugin/piedtamarin_run.py dist/piedtamarin_run.py

      # ── Step 6: Check runtime dependencies ──────────────────────────────────
      # Linux — expected: libc.so.6, libm.so.6, ld-linux-x86-64.so.2.
      #         ideally not present: libvamp-sdk.so, libstdc++.so.6, libgcc_s.so.1.
      # Windows — expected: KERNEL32.dll, msvcrt.dll / api-ms-win-crt-*.dll.
      #         ideally not present: libstdc++-6.dll, libgcc_s_seh-1.dll (both
      #         are statically linked in via -static-libstdc++ -static-libgcc).
      # macOS — expected: only system libs under /usr/lib/ (libc++.1.dylib,          
      #         libSystem.B.dylib); ideally not present: any /opt/homebrew/... or
      #         /usr/local/... path, which would mean it depends on Homebrew being
      #         installed on the end user's machine.
      - name: Check dynamic dependencies (Linux)
        if: runner.os == 'Linux'              
        run: |
          echo "birdnet-vamp.so"
          ldd dist/birdnet-vamp.so || true
          echo ""

          echo "perch-vamp.so"
          ldd dist/perch-vamp.so || true
          echo ""

          echo "surfperch-vamp.so"
          ldd dist/surfperch-vamp.so || true

          echo "yamnet-vamp.so"
          ldd dist/yamnet-vamp.so || true

          echo "piedtamarin-vamp.so"
          ldd dist/piedtamarin-vamp.so || true

      # ldd also exists in MSYS2; just replace .so with .dll
      - name: Check dynamic dependencies (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "birdnet-vamp.dll"
          ldd dist/birdnet-vamp.dll || true
          echo ""

          echo "perch-vamp.dll"
          ldd dist/perch-vamp.dll || true
          echo ""

          echo "surfperch-vamp.dll"
          ldd dist/surfperch-vamp.dll || true

          echo "yamnet-vamp.dll"
          ldd dist/yamnet-vamp.dll || true

          echo "piedtamarin-vamp.dll"
          ldd dist/piedtamarin-vamp.dll || true

      # macOS does not have ldd; otool -L is the native equivalent
      # (part of the Xcode Command Line Tools, already present on the runner).
      - name: Check dynamic dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "birdnet-vamp.dylib"
          otool -L dist/birdnet-vamp.dylib || true
          echo ""

          echo "perch-vamp.dylib"
          otool -L dist/perch-vamp.dylib || true
          echo ""

          echo "surfperch-vamp.dylib"
          otool -L dist/surfperch-vamp.dylib || true

          echo "yamnet-vamp.dylib"
          otool -L dist/yamnet-vamp.dylib || true

          echo "piedtamarin-vamp.dylib"
          otool -L dist/piedtamarin-vamp.dylib || true

      # ── Step 7: Upload the dist/ folder as a workflow artifact ──────────────
      # upload-artifact zips the folder contents automatically.
      # This artifact is available for download from the Actions run summary.
      # Confirm that each .dll exports the vampGetPluginDescriptor symbol,
      # which is what Audacity / Sonic Visualiser look for via GetProcAddress when loading the plugin. 
      # If it doesn't export it, the host loads the DLL without any error but lists no plugin.
      - name: Verify VAMP entry point is exported (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          for f in dist/*.dll; do
            echo "== $f =="
            objdump -p "$f" | grep -q vampGetPluginDescriptor \
              && echo "OK: vampGetPluginDescriptor exported" \
              || { echo "MISSING vampGetPluginDescriptor export"; exit 1; }
          done

      # macOS exports symbols by default (like Linux ELF, unlike Windows PE)
      - name: Verify VAMP entry point is exported (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in dist/*.dylib; do
            echo "== $f =="
            nm -gU "$f" | grep -q vampGetPluginDescriptor \
              && echo "OK: vampGetPluginDescriptor exported" \
              || { echo "MISSING vampGetPluginDescriptor export"; exit 1; }
          done

      - name: Upload Plugin Pack
        uses: actions/upload-artifact@v7
        with:
          # Mandatory dynamic name, as the three jobs (Linux, Windows, macOS) 
          # run in parallel in the same workflow run, and upload-artifact does not accept duplicate names.
          name: bioacoustic-vamp-pack-${{ runner.os == 'Windows' && 'windows_x86_64' || runner.os == 'macOS' && 'macos_arm64' || 'linux_x86_64' }}
          path: dist/

      # ── Step 8: Publish GitHub Release ──────────────────────────────────────
      # Only runs when the workflow was triggered by a version tag (e.g. v1.2.0).
      # Creates an explicit .zip from dist/ and attaches it to the Release.
      # The zip -j flag flattens the paths so there are no subfolders inside
      # the archive.
      - name: Create Release Zip (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')   
        run: |
          cd dist && zip -j ../bioacoustic-vamp-pack-linux_x86_64.zip *

      - name: Create Release Zip (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: msys2 {0}
        run: |
          cd dist && zip -j ../bioacoustic-vamp-pack-windows_x86_64.zip *

      - name: Create Release Zip (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist && zip -j ../bioacoustic-vamp-pack-macos_arm64.zip *

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bioacoustic-vamp-pack-linux_x86_64.zip
            bioacoustic-vamp-pack-windows_x86_64.zip
            bioacoustic-vamp-pack-macos_arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
